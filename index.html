<!DOCTYPE html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Déclare le support natif du Dark Mode (par défaut) et du Light Mode -->
    <meta name="color-scheme" content="dark light" />
    <script>
      // Applique immédiatement le thème sauvegardé (ou 'dark' par défaut) avant le rendu pour éviter tout flash blanc
      try {
        const savedTheme = localStorage.getItem('tag_booki_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.querySelector('meta[name="color-scheme"]').content = savedTheme;
      } catch (e) {}
    </script>
    <title>Booki Masterclass — L'Atelier Interactif de Tag</title>
    <!-- Police Raleway (celle du projet Booki !) + Plus Jakarta Sans & JetBrains Mono pour le code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Raleway:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome 6.2.1 (exactement la version utilisée dans le projet Booki de Tag) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
      integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!--
      En React, toute l'application vient s'injecter dans cette unique balise <div id="root">.
      Le fichier src/main.jsx se charge de "monter" notre composant principal <App /> ici !
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
